<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字巡课墙 - 教师控制台</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; }
        .page-header { padding: 14px 24px; background: #1a1f26; border-bottom: 1px solid #2d3640; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .page-header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .live-dot.on { background: #f4212e; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        select, button { font-family: inherit; }
        select { padding: 8px 12px; background: #0d1117; border: 1px solid #2d3640; border-radius: 8px; color: #e7e9ea; font-size: 13px; outline: none; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn.primary { background: #1d9bf0; color: #fff; }
        .btn.danger { background: #f4212e; color: #fff; }
        .btn.ghost { background: #2d3640; color: #e7e9ea; }
        .btn.green { background: #00ba7c; color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav a { padding: 8px 14px; background: #2d3640; color: #e7e9ea; text-decoration: none; border-radius: 8px; font-size: 13px; }

        .layout { display: flex; gap: 16px; padding: 16px 24px; }
        .main { flex: 1; min-width: 0; }
        .sidebar { width: 280px; flex-shrink: 0; }

        .preview-box { background: #000; border: 1px solid #2d3640; border-radius: 12px; overflow: hidden; margin-bottom: 16px; position: relative; }
        .preview-box video { width: 100%; display: block; max-height: 220px; object-fit: contain; background: #000; }
        .preview-box .ph { padding: 40px; text-align: center; color: #555; font-size: 13px; }

        .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: #1a1f26; border: 1px solid #2d3640; border-radius: 10px; padding: 12px; text-align: center; }
        .stat-card .num { font-size: 22px; font-weight: 700; }
        .stat-card .label { font-size: 11px; color: #8b98a5; margin-top: 4px; }

        .wall-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .sort-chips { display: flex; gap: 6px; }
        .chip { padding: 6px 12px; background: #1a1f26; border: 1px solid #2d3640; border-radius: 18px; cursor: pointer; font-size: 12px; color: #8b98a5; }
        .chip.active { background: rgba(29,155,240,0.15); border-color: #1d9bf0; color: #1d9bf0; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .cell { background: #1a1f26; border: 2px solid #2d3640; border-radius: 12px; padding: 12px; cursor: pointer; transition: transform 0.1s; position: relative; }
        .cell:hover { transform: translateY(-2px); border-color: #3a4754; }
        .cell.help { border-color: #f4212e; animation: flashRed 1s infinite; }
        @keyframes flashRed { 0%,100% { box-shadow: 0 0 0 0 rgba(244,33,46,0.6); } 50% { box-shadow: 0 0 0 4px rgba(244,33,46,0); } }
        .cell .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .cell .avatar { width: 28px; height: 28px; border-radius: 50%; background: #2d3640; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
        .cell .name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cell .thumb { background: #0d1117; border-radius: 6px; height: 70px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 8px; line-height: 1.3; color: #5c6b7a; padding: 6px; white-space: pre; }
        .cell .meta { display: flex; gap: 8px; margin-top: 8px; font-size: 11px; color: #8b98a5; flex-wrap: wrap; }
        .cell .meta b { color: #e7e9ea; }
        .tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .tag.focused { background: rgba(0,186,124,0.15); color: #00ba7c; }
        .tag.idle { background: rgba(255,184,0,0.15); color: #ffb800; }
        .tag.away { background: rgba(244,33,46,0.15); color: #f4212e; }
        .tag.offline { background: rgba(139,152,165,0.15); color: #8b98a5; }

        .panel { background: #1a1f26; border: 1px solid #2d3640; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .panel h3 { font-size: 14px; margin-bottom: 12px; }
        .help-item { background: #0d1117; border-left: 3px solid #f4212e; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
        .help-item .hu { font-weight: 600; margin-bottom: 4px; }
        .help-item .ha { display: flex; gap: 6px; margin-top: 6px; }
        .empty { color: #5c6b7a; font-size: 12px; text-align: center; padding: 16px; }

        /* 单人聚焦弹窗 */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-bg.show { display: flex; }
        .modal { background: #15191e; border: 1px solid #2d3640; border-radius: 14px; width: 760px; max-width: 100%; max-height: 90vh; overflow: auto; }
        .modal-head { padding: 14px 18px; border-bottom: 1px solid #2d3640; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 18px; }
        .modal-head .mh-title { font-size: 15px; font-weight: 700; }
        .code-view { width: 100%; min-height: 280px; background: #0d1117; border: 1px solid #2d3640; border-radius: 8px; color: #e7e9ea; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 12px; resize: vertical; outline: none; line-height: 1.5; }
        .code-view:read-only { opacity: 0.85; }
        .focus-meta { display: flex; gap: 14px; font-size: 12px; color: #8b98a5; margin: 10px 0; flex-wrap: wrap; }
        .focus-meta b { color: #e7e9ea; }
        .takeover-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .cursor-info { font-size: 11px; color: #1d9bf0; }
        .toast { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
        .toast .t { background: #1d9bf0; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .toast .t.help { background: #f4212e; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><span class="live-dot" id="liveDot"></span> 数字巡课墙 · 教师控制台</h1>
        <div class="toolbar">
            <select id="classSelect" onchange="onClassChange()"><option value="">选择班级...</option></select>
            <button class="btn primary" id="startBtn" onclick="startClass()">开始上课</button>
            <button class="btn green" id="shareBtn" onclick="toggleShare()" disabled>共享屏幕</button>
            <button class="btn danger" id="endBtn" onclick="endClass()" disabled>下课</button>
            <span class="nav"><a href="/chat">💬 聊天室</a> <a href="/teacher-dashboard">返回</a></span>
        </div>
    </div>

    <div class="layout">
        <div class="main">
            <div class="stat-row">
                <div class="stat-card"><div class="num" id="stOnline">0</div><div class="label">在线学生</div></div>
                <div class="stat-card"><div class="num" id="stHelp" style="color:#f4212e">0</div><div class="label">待处理求助</div></div>
                <div class="stat-card"><div class="num" id="stAway" style="color:#ffb800">0</div><div class="label">离开/分心</div></div>
                <div class="stat-card"><div class="num" id="stLines" style="color:#00ba7c">0</div><div class="label">总代码行数</div></div>
            </div>

            <div class="wall-head">
                <div class="sort-chips">
                    <div class="chip active" data-sort="default" onclick="setSort('default')">默认</div>
                    <div class="chip" data-sort="abnormal" onclick="setSort('abnormal')">异常优先</div>
                    <div class="chip" data-sort="help" onclick="setSort('help')">求助优先</div>
                    <div class="chip" data-sort="code" onclick="setSort('code')">代码量</div>
                </div>
                <span style="font-size:12px;color:#8b98a5" id="wallTip">未开课</span>
            </div>
            <div class="grid" id="wall"><div class="empty">选择班级并开始上课，全班动态墙将在此展示。</div></div>
        </div>

        <div class="sidebar">
            <div class="preview-box">
                <video id="localPreview" autoplay muted playsinline style="display:none"></video>
                <div class="ph" id="previewPh">屏幕共享预览区<br>点击「共享屏幕」开始演示</div>
                <div class="cc-danmaku" id="danmakuLayer"></div>
            </div>
            <div class="panel">
                <h3>🔔 求助队列</h3>
                <div id="helpList"><div class="empty">暂无求助</div></div>
            </div>
            <div style="height:420px;display:flex;flex-direction:column">
                <div style="font-size:13px;color:#8b98a5;margin-bottom:8px">💬 课堂互动聊天室</div>
                <div id="chatMount" style="flex:1;min-height:0">开课后进入聊天室…</div>
            </div>
        </div>
    </div>

    <!-- 单人聚焦弹窗 -->
    <div class="modal-bg" id="focusModal">
        <div class="modal">
            <div class="modal-head">
                <span class="mh-title" id="fmTitle">学生编辑器视野</span>
                <button class="btn ghost" onclick="closeFocus()">关闭</button>
            </div>
            <div class="modal-body">
                <div class="focus-meta" id="fmMeta"></div>
                <div class="takeover-row">
                    <button class="btn primary" id="takeoverBtn" onclick="toggleTakeover()">接管修改</button>
                    <span class="cursor-info" id="cursorInfo">只读视角</span>
                </div>
                <textarea class="code-view" id="codeView" readonly placeholder="等待学生编辑器同步..."></textarea>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/classroom-chat.js"></script>
    <script>
        const sortChipsEl = document.querySelectorAll('.chip');
        let me = null, ws = null, sessionId = null, currentSort = 'default';
        let pollTimer = null, statusMap = {}, helpQueue = [];
        // WebRTC: 每个学生一个 PeerConnection
        let localStream = null;
        const peers = {}; // userId -> RTCPeerConnection
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        // 聚焦/接管
        let focusUserId = null, takeoverOn = false, takeoverStart = 0;

        async function api(url, opts = {}) {
            const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'HTTP ' + res.status); }
            return res.json();
        }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
        function toast(msg, isHelp) {
            const el = document.createElement('div');
            el.className = 't' + (isHelp ? ' help' : '');
            el.textContent = msg;
            document.getElementById('toast').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        async function init() {
            try { me = await api('/api/auth/me'); } catch { location.href = '/login'; return; }
            const u = me.user || me;
            if (u.role !== 'teacher' && u.role !== 'admin') {
                document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;color:#e7e9ea;font-family:-apple-system,sans-serif"><div style="font-size:48px">🔒</div><h2>巡课台 / 投影台仅教师可用</h2><p style="color:#8b98a5">学生请返回控制台查看班级信息与作业。</p><a href="/dashboard" style="padding:10px 20px;background:#1d9bf0;color:#fff;border-radius:8px;text-decoration:none">返回控制台</a></div>';
                setTimeout(() => { location.href = '/dashboard'; }, 2500);
                return;
            }
            await loadClasses();
            connectWS();
        }

        async function loadClasses() {
            try {
                const d = await api('/api/classes');
                const list = d.classes || d || [];
                const sel = document.getElementById('classSelect');
                list.forEach(c => {
                    const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o);
                });
                const qsClass = new URLSearchParams(location.search).get('classId');
                if (qsClass && list.some(c => String(c.id) === String(qsClass))) {
                    sel.value = qsClass; onClassChange();
                }
            } catch (e) { console.warn(e); }
        }

        async function onClassChange() {
            const classId = document.getElementById('classSelect').value;
            if (!classId) return;
            initChat(parseInt(classId));
            try {
                const d = await api('/api/live/active?classId=' + classId);
                if (d.session) { sessionId = d.session.id; enterLiveUI(); refreshWall(); }
                else resetUI();
            } catch (e) { resetUI(); }
        }

        let chatClassId = null;
        function initChat(classId) {
            if (chatClassId === classId) return;
            chatClassId = classId;
            ClassroomChat.init({
                mountEl: document.getElementById('chatMount'),
                danmakuLayer: document.getElementById('danmakuLayer'),
                classId, me: me.user || me, isTeacher: true,
                getWS: () => ws
            });
        }

        function resetUI() {
            sessionId = null;
            document.getElementById('liveDot').classList.remove('on');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('endBtn').disabled = true;
            document.getElementById('shareBtn').disabled = true;
            document.getElementById('wallTip').textContent = '未开课';
        }
        function enterLiveUI() {
            document.getElementById('liveDot').classList.add('on');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('endBtn').disabled = false;
            document.getElementById('shareBtn').disabled = false;
            document.getElementById('wallTip').textContent = '直播中 · 房间 #' + sessionId;
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'live_subscribe', sessionId, role: 'teacher' }));
            startPolling();
        }

        async function startClass() {
            const classId = document.getElementById('classSelect').value;
            if (!classId) return toast('请先选择班级');
            try {
                const d = await api('/api/live/start', { method: 'POST', body: JSON.stringify({ classId: parseInt(classId) }) });
                sessionId = d.session.id;
                enterLiveUI();
                refreshWall();
                toast('已开课，全班协同房间已初始化');
            } catch (e) { toast('开课失败: ' + e.message); }
        }

        async function endClass() {
            if (!sessionId || !confirm('确认下课？将生成回放并把学生编辑器转为只读。')) return;
            try {
                const d = await api('/api/live/' + sessionId + '/end', { method: 'POST' });
                stopShare();
                stopPolling();
                await showReport();
                resetUI();
                toast('已下课，回放: ' + d.replayUrl);
            } catch (e) { toast('下课失败: ' + e.message); }
        }

        // ==================== 巡课墙轮询 ====================
        function startPolling() { stopPolling(); refreshWall(); pollTimer = setInterval(refreshWall, 3000); }
        function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

        async function refreshWall() {
            if (!sessionId) return;
            try {
                const d = await api('/api/live/' + sessionId + '/wall?sort=' + currentSort);
                statusMap = {};
                d.students.forEach(s => statusMap[s.user_id] = s);
                renderWall(d.students);
                renderHelpFromWall(d.students);
            } catch (e) { /* 静默 */ }
        }

        function setSort(s) {
            currentSort = s;
            sortChipsEl.forEach(c => c.classList.toggle('active', c.dataset.sort === s));
            refreshWall();
        }

        function renderWall(students) {
            const el = document.getElementById('wall');
            if (!students.length) { el.innerHTML = '<div class="empty">本班暂无学生</div>'; return; }
            let online = 0, away = 0, lines = 0, helps = 0;
            el.innerHTML = students.map(s => {
                if (s.focus_state !== 'offline') online++;
                if (s.focus_state === 'away' || s.idle) away++;
                lines += s.code_lines || 0;
                if (s.hasPendingHelp) helps++;
                let stateTag = s.focus_state;
                let stateLabel = { focused: '专注', away: '离开', offline: '离线', idle: '卡顿' }[s.focus_state] || s.focus_state;
                if (s.idle && s.focus_state === 'focused') { stateTag = 'idle'; stateLabel = '无操作'; }
                return `<div class="cell ${s.hasPendingHelp ? 'help' : ''}" onclick="openFocus(${s.user_id})">
                    <div class="top">
                        <div class="avatar">${esc((s.username || '?')[0])}</div>
                        <div class="name">${esc(s.username)}</div>
                        <span class="tag ${stateTag}">${stateLabel}</span>
                    </div>
                    <div class="thumb">${esc((s.thumbnail || '// 等待编码...').slice(0, 220))}</div>
                    <div class="meta">
                        <span>📄 <b>${esc(s.current_file || '-')}</b></span>
                        <span>⌨ <b>${s.code_lines || 0}</b>行</span>
                        <span>🔄 <b>${s.tab_switches || 0}</b>次切屏</span>
                        ${s.away_seconds ? `<span>⏱ <b>${Math.round(s.away_seconds / 60) || 1}</b>分离开</span>` : ''}
                        ${s.compile_fails ? `<span>❌ <b>${s.compile_fails}</b></span>` : ''}
                    </div>
                </div>`;
            }).join('');
            document.getElementById('stOnline').textContent = online;
            document.getElementById('stAway').textContent = away;
            document.getElementById('stLines').textContent = lines;
            document.getElementById('stHelp').textContent = helps;
        }

        function renderHelpFromWall(students) {
            const pending = students.filter(s => s.hasPendingHelp);
            const el = document.getElementById('helpList');
            if (!pending.length) { el.innerHTML = '<div class="empty">暂无求助</div>'; return; }
            el.innerHTML = pending.map(s => `<div class="help-item">
                <div class="hu">🙋 ${esc(s.username)} 请求帮助</div>
                <div style="color:#8b98a5">正在编辑 ${esc(s.current_file || '-')}</div>
                <div class="ha">
                    <button class="btn primary" style="padding:5px 10px;font-size:11px" onclick="openFocus(${s.user_id})">进入编辑器</button>
                </div>
            </div>`).join('');
        }

        // ==================== 单人聚焦 / 接管 ====================
        async function openFocus(uid) {
            focusUserId = uid; takeoverOn = false;
            const s = statusMap[uid] || {};
            document.getElementById('fmTitle').textContent = (s.username || '学生') + ' · 专属编辑器视野';
            document.getElementById('fmMeta').innerHTML = `
                <span>状态 <b>${esc(s.focus_state || '-')}</b></span>
                <span>切屏 <b>${s.tab_switches || 0}</b>次</span>
                <span>编译失败 <b>${s.compile_fails || 0}</b></span>
                <span>求助 <b>${s.help_count || 0}</b>次</span>
                <span>当前 <b>${esc(s.current_file || '-')}:${s.current_line || 0}</b></span>`;
            const cv = document.getElementById('codeView');
            cv.value = s.thumbnail || '// 等待学生编辑器实时同步...';
            cv.readOnly = true;
            document.getElementById('takeoverBtn').textContent = '接管修改';
            document.getElementById('cursorInfo').textContent = '只读视角';
            document.getElementById('focusModal').classList.add('show');
            try { await api('/api/live/' + sessionId + '/intervention', { method: 'POST', body: JSON.stringify({ studentId: uid, kind: 'focus' }) }); } catch {}
            // 请求学生推送完整代码
            wsSend({ type: 'code_sync', sessionId, targetUserId: uid, patch: null, cursor: { request: true, teacher: true } });
        }

        function toggleTakeover() {
            if (!focusUserId) return;
            takeoverOn = !takeoverOn;
            const cv = document.getElementById('codeView');
            cv.readOnly = !takeoverOn;
            document.getElementById('takeoverBtn').textContent = takeoverOn ? '退出接管' : '接管修改';
            document.getElementById('cursorInfo').textContent = takeoverOn ? '🔴 接管中（你的修改将强同步给学生）' : '只读视角';
            wsSend({ type: 'takeover', sessionId, targetUserId: focusUserId, on: takeoverOn });
            if (takeoverOn) { takeoverStart = Date.now(); }
            else if (takeoverStart) {
                const dur = Math.round((Date.now() - takeoverStart) / 1000);
                api('/api/live/' + sessionId + '/intervention', { method: 'POST', body: JSON.stringify({ studentId: focusUserId, kind: 'takeover', durationSeconds: dur }) }).catch(() => {});
                takeoverStart = 0;
            }
        }

        document.getElementById('codeView').addEventListener('input', () => {
            if (takeoverOn && focusUserId) {
                wsSend({ type: 'code_sync', sessionId, targetUserId: focusUserId, patch: document.getElementById('codeView').value, cursor: { teacher: true } });
            }
        });

        function closeFocus() {
            if (takeoverOn) toggleTakeover();
            focusUserId = null;
            document.getElementById('focusModal').classList.remove('show');
        }

        // ==================== WebRTC 屏幕共享（教师广播）====================
        async function toggleShare() {
            if (localStream) { stopShare(); return; }
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            } catch (e) { return toast('已取消共享或浏览器不支持'); }
            const v = document.getElementById('localPreview');
            v.srcObject = localStream; v.style.display = 'block';
            document.getElementById('previewPh').style.display = 'none';
            document.getElementById('shareBtn').textContent = '停止共享';
            localStream.getVideoTracks()[0].addEventListener('ended', stopShare);
            // 给所有已在线学生发起 offer
            Object.keys(statusMap).forEach(uid => { if (statusMap[uid].focus_state !== 'offline') createOffer(parseInt(uid)); });
        }

        function stopShare() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            Object.values(peers).forEach(pc => pc.close());
            Object.keys(peers).forEach(k => delete peers[k]);
            const v = document.getElementById('localPreview');
            v.srcObject = null; v.style.display = 'none';
            document.getElementById('previewPh').style.display = '';
            document.getElementById('shareBtn').textContent = '共享屏幕';
        }

        function createOffer(uid) {
            if (!localStream) return;
            let pc = peers[uid];
            if (!pc) { pc = newPeer(uid); }
            localStream.getTracks().forEach(t => { try { pc.addTrack(t, localStream); } catch {} });
            pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
                wsSend({ type: 'webrtc_signal', sessionId, targetUserId: uid, kind: 'offer', signal: pc.localDescription });
            });
        }

        function newPeer(uid) {
            const pc = new RTCPeerConnection(rtcConfig);
            pc.onicecandidate = e => { if (e.candidate) wsSend({ type: 'webrtc_signal', sessionId, targetUserId: uid, kind: 'ice', signal: e.candidate }); };
            peers[uid] = pc;
            return pc;
        }

        // ==================== WebSocket ====================
        function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => {
                const token = document.cookie.match(/token=([^;]+)/)?.[1];
                if (token) ws.send(JSON.stringify({ type: 'auth', token }));
            };
            ws.onmessage = ev => {
                let m; try { m = JSON.parse(ev.data); } catch { return; }
                handleWS(m);
            };
            ws.onclose = () => setTimeout(connectWS, 2000);
        }

        function handleWS(m) {
            switch (m.type) {
                case 'auth_ok':
                    if (sessionId) wsSend({ type: 'live_subscribe', sessionId, role: 'teacher' });
                    if (window.ClassroomChat && ClassroomChat.getRoomId()) wsSend({ type: 'join_room', roomId: ClassroomChat.getRoomId() });
                    break;
                case 'live_presence':
                    // 学生上线 → 若正在共享则发 offer
                    if (m.online && localStream) createOffer(m.userId);
                    break;
                case 'live_status':
                    if (m.userId && statusMap[m.userId]) Object.assign(statusMap[m.userId], m.status);
                    break;
                case 'help_request':
                    toast('🙋 ' + (m.username || '学生') + ' 呼叫老师：' + (m.message || ''), true);
                    refreshWall();
                    break;
                case 'webrtc_signal':
                    onSignal(m); break;
                case 'code_sync':
                    // 学生回传完整代码
                    if (focusUserId === m.fromUserId && m.patch != null && !takeoverOn) {
                        document.getElementById('codeView').value = m.patch;
                    }
                    if (focusUserId === m.fromUserId && m.cursor && m.cursor.line != null) {
                        document.getElementById('cursorInfo').textContent = takeoverOn ? '🔴 接管中' : ('学生光标 第 ' + m.cursor.line + ' 行');
                    }
                    break;
                default:
                    if (window.ClassroomChat) ClassroomChat.handleWS(m);
            }
        }

        async function onSignal(m) {
            const uid = m.fromUserId;
            let pc = peers[uid];
            if (m.kind === 'answer') {
                if (pc) await pc.setRemoteDescription(m.signal);
            } else if (m.kind === 'ice') {
                if (pc) { try { await pc.addIceCandidate(m.signal); } catch {} }
            }
        }

        // ==================== 结课报告 ====================
        async function showReport() {
            try {
                const r = await api('/api/live/' + sessionId + '/report');
                const cs = r.classSummary;
                const rows = r.students.map(s => `<tr>
                    <td>${esc(s.username)}</td>
                    <td>${Math.round(s.watch_seconds / 60)}分</td>
                    <td>${s.focus_percent}%</td>
                    <td>${s.tab_switches}</td>
                    <td>${s.code_lines}</td>
                    <td>${s.compile_fails}</td>
                    <td>${s.help_count}</td></tr>`).join('');
                const hot = cs.hotspots.map(h => `<li>${esc(h.file || '-')} · 报错 ${h.fails} · 求助 ${h.helps}</li>`).join('') || '<li>无</li>';
                document.getElementById('fmTitle').textContent = '📊 课堂教学质量报告';
                document.getElementById('fmMeta').innerHTML = `
                    <span>课堂时长 <b>${Math.round(r.durationSeconds / 60)}</b>分钟</span>
                    <span>平均专注度 <b>${cs.avgFocus}%</b></span>
                    <span>总求助 <b>${cs.totalHelps}</b></span>
                    <span>主动进入编辑器 <b>${cs.teacherEnterCount}</b>次</span>
                    <span>平均协助 <b>${cs.avgAssistSeconds}</b>秒</span>`;
                document.querySelector('.takeover-row').style.display = 'none';
                const cv = document.getElementById('codeView');
                cv.style.display = 'none';
                let tbl = document.getElementById('reportTable');
                if (!tbl) { tbl = document.createElement('div'); tbl.id = 'reportTable'; cv.parentElement.appendChild(tbl); }
                tbl.innerHTML = `
                    <h3 style="margin:10px 0;font-size:14px">学生维度</h3>
                    <table style="width:100%;border-collapse:collapse;font-size:12px">
                        <thead><tr style="color:#8b98a5;text-align:left">
                            <th>学生</th><th>听课</th><th>专注度</th><th>切屏</th><th>代码行</th><th>编译失败</th><th>求助</th>
                        </tr></thead><tbody>${rows}</tbody></table>
                    <h3 style="margin:14px 0 8px;font-size:14px">知识点卡点（报错/求助最多）</h3>
                    <ul style="font-size:12px;color:#b3bcc4;padding-left:18px">${hot}</ul>`;
                document.getElementById('focusModal').classList.add('show');
            } catch (e) { toast('报告生成失败: ' + e.message); }
        }

        init();
    </script>
</body>
</html>
