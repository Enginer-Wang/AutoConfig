<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 课件共享平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        .stats-page { padding: 100px 20px 60px; max-width: 1200px; margin: 0 auto; }
        .stats-page h1 { font-size: 2rem; text-align: center; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .stats-page .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }

        .overview-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .overview-card { background: rgba(30,30,60,.6); border: 1px solid rgba(99,102,241,.15); border-radius: 16px; padding: 24px; text-align: center; }
        .overview-card .value { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .overview-card .label { color: #94a3b8; font-size: .9rem; margin-top: 4px; }

        .stats-section { margin-bottom: 48px; }
        .stats-section h2 { font-size: 1.4rem; color: #e2e8f0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

        .subject-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .subject-stat-card { background: rgba(30,30,60,.6); border: 1px solid rgba(99,102,241,.12); border-radius: 12px; padding: 20px; }
        .subject-stat-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .subject-stat-card .name { font-size: 1.05rem; font-weight: 600; color: #e2e8f0; }
        .subject-stat-card .level-tag { padding: 2px 10px; border-radius: 6px; font-size: .75rem; background: rgba(99,102,241,.15); color: #818cf8; }
        .subject-stat-card .metrics { display: flex; gap: 16px; }
        .subject-stat-card .metric { text-align: center; }
        .subject-stat-card .metric .val { font-size: 1.3rem; font-weight: 600; color: #c7d2fe; }
        .subject-stat-card .metric .lbl { font-size: .75rem; color: #64748b; }

        .ranking-table { width: 100%; border-collapse: collapse; }
        .ranking-table th { text-align: left; padding: 12px 16px; color: #94a3b8; font-size: .85rem; border-bottom: 1px solid rgba(99,102,241,.15); }
        .ranking-table td { padding: 12px 16px; color: #e2e8f0; font-size: .9rem; border-bottom: 1px solid rgba(99,102,241,.08); }
        .ranking-table tr:hover td { background: rgba(99,102,241,.05); }
        .rank-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(99,102,241,.15); color: #818cf8; font-weight: 700; font-size: .85rem; }
        .rank-1 { background: rgba(234,179,8,.2); color: #eab308; }
        .rank-2 { background: rgba(168,162,158,.2); color: #a8a29e; }
        .rank-3 { background: rgba(180,83,9,.2); color: #d97706; }

        .tab-nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 20px; border-radius: 8px; background: rgba(99,102,241,.08); color: #94a3b8; border: 1px solid transparent; cursor: pointer; font-size: .9rem; transition: all .2s; }
        .tab-btn:hover { background: rgba(99,102,241,.15); }
        .tab-btn.active { background: rgba(99,102,241,.2); color: #818cf8; border-color: #6366f1; }

        .empty-msg { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
    </nav>

    <div class="stats-page">
        <h1>📊 数据统计</h1>
        <p class="subtitle">课件访问量、学生练习情况一览</p>

        <!-- 总体概览 -->
        <div class="overview-cards" id="overviewCards">
            <div class="overview-card"><div class="value" id="ov-teachers">-</div><div class="label">注册教师</div></div>
            <div class="overview-card"><div class="value" id="ov-students">-</div><div class="label">注册学生</div></div>
            <div class="overview-card"><div class="value" id="ov-projects">-</div><div class="label">共享课件</div></div>
            <div class="overview-card"><div class="value" id="ov-visits">-</div><div class="label">总访问量</div></div>
        </div>

        <!-- 学科课件统计 -->
        <div class="stats-section">
            <h2>📖 各学科课件统计</h2>
            <div class="subject-stats-grid" id="subjectStatsGrid">
                <div class="empty-msg">加载中...</div>
            </div>
        </div>

        <!-- 热门课件排行 -->
        <div class="stats-section">
            <h2>🔥 热门课件 TOP10</h2>
            <div style="overflow-x:auto">
                <table class="ranking-table" id="hotProjectsTable">
                    <thead><tr><th>#</th><th>课件名称</th><th>学科</th><th>作者</th><th>访问量</th><th>点赞数</th></tr></thead>
                    <tbody id="hotProjectsBody"><tr><td colspan="6" class="empty-msg">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- 优秀学生排行 -->
        <div class="stats-section">
            <h2>🏆 优秀学生排行</h2>
            <div style="overflow-x:auto">
                <table class="ranking-table" id="studentsTable">
                    <thead><tr><th>#</th><th>学生</th><th>学校</th><th>完成练习数</th><th>总积分</th><th>平均分</th></tr></thead>
                    <tbody id="studentsBody"><tr><td colspan="6" class="empty-msg">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initNavbar('/stats');
            loadSubjectStats();
            loadHotProjects();
            loadTopStudents();
        });

        async function updateNavForAuth() {
            // Handled by initNavbar
        }

        async function loadSubjectStats() {
            try {
                const data = await api('/api/subjects/stats');
                
                // 总体概览
                document.getElementById('ov-teachers').textContent = data.overall.teacher_count || 0;
                document.getElementById('ov-students').textContent = data.overall.student_count || 0;
                document.getElementById('ov-projects').textContent = data.overall.total_projects || 0;
                document.getElementById('ov-visits').textContent = data.overall.total_visits || 0;

                // 学科统计
                const grid = document.getElementById('subjectStatsGrid');
                if (data.subjectStats.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">暂无学科数据</div>';
                    return;
                }
                grid.innerHTML = data.subjectStats.map(s => `
                    <div class="subject-stat-card">
                        <div class="header">
                            <span class="name">${s.subject}</span>
                            <span class="level-tag">${({elementary:'小学',middle:'初中',high:'高中'})[s.school_level] || s.school_level}</span>
                        </div>
                        <div class="metrics">
                            <div class="metric"><div class="val">${s.project_count}</div><div class="lbl">课件数</div></div>
                            <div class="metric"><div class="val">${s.total_visits}</div><div class="lbl">总访问</div></div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('加载学科统计失败:', err);
            }
        }

        async function loadHotProjects() {
            try {
                const data = await api('/api/subjects/hot?limit=10');
                const tbody = document.getElementById('hotProjectsBody');
                if (data.projects.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = data.projects.map((p, i) => `
                    <tr>
                        <td><span class="rank-num ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</span></td>
                        <td><a href="/site/${p.username}/${p.slug}" target="_blank" style="color:#818cf8;text-decoration:none">${escapeHtml(p.name)}</a></td>
                        <td>${p.subject || '-'}</td>
                        <td>${escapeHtml(p.username)}</td>
                        <td>${p.visit_count || 0}</td>
                        <td>${p.like_count || 0}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('加载热门课件失败:', err);
            }
        }

        async function loadTopStudents() {
            try {
                const data = await api('/api/exercises/top-students?limit=20');
                const tbody = document.getElementById('studentsBody');
                if (data.students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">暂无学生练习数据</td></tr>';
                    return;
                }
                tbody.innerHTML = data.students.map((s, i) => `
                    <tr>
                        <td><span class="rank-num ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</span></td>
                        <td>${escapeHtml(s.username)}</td>
                        <td>${escapeHtml(s.school || '-')}</td>
                        <td>${s.exercises_completed} / ${s.exercises_done}</td>
                        <td>${s.total_score}</td>
                        <td>${Math.round(s.avg_score)}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('加载学生排行失败:', err);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
